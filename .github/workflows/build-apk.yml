name: Build APK

# Builds the app on every push and pull request, runs the unit tests, and publishes both APKs as
# downloadable artifacts. The release APK is *installable even without a keystore*: the Gradle
# build falls back to the debug signing config (see app/build.gradle.kts), which is what makes a
# CI-produced release APK useful for testing R8/shrinking on a real device.

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:
    inputs:
      newpipe_extractor_version:
        description: 'NewPipeExtractor version (tag or 40-char commit hash)'
        required: false
        default: 'v0.26.5'

# A read-only token is all this workflow needs: it builds, it never pushes.
permissions:
  contents: read

# One build per ref: a second push cancels the first instead of queueing two Gradle daemons.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Only the daemon flag lives here. Heap sizing and every other JVM argument belongs in
  # gradle.properties: GRADLE_OPTS is split on whitespace with no shell-style quoting, so a
  # quoted `-Dorg.gradle.jvmargs="-Xmx..."` would be passed through with the quote characters
  # still in the value and Gradle would reject it.
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  NEWPIPE_EXTRACTOR_VERSION: ${{ github.event.inputs.newpipe_extractor_version || 'v0.26.5' }}

jobs:
  build:
    name: Test, assemble and publish APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Java 17 is what AGP 8.9 requires; the app's own bytecode target (11) is unaffected.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Verifies that gradle/wrapper/gradle-wrapper.jar is the genuine, unmodified wrapper before
      # it is allowed to execute — the wrapper is the one binary in the repository that runs
      # arbitrary code during the build.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Handles the Gradle user-home cache (dependencies + build cache), which is where almost all
      # of the build time goes on a cold runner. `cache-encryption-key` is intentionally absent:
      # this project has no secrets to keep, and an unencrypted cache is faster to restore.
      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          add-job-summary: on-failure

      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --stacktrace -PnewpipeExtractorVersion=${{ env.NEWPIPE_EXTRACTOR_VERSION }} assembleDebug

      # R8 full mode + resource shrinking run here. This is the configuration that actually ships,
      # so it is the one worth failing CI over.
      - name: Assemble release APK
        run: ./gradlew --stacktrace -PnewpipeExtractorVersion=${{ env.NEWPIPE_EXTRACTOR_VERSION }} assembleRelease

      - name: Collect build report
        if: always()
        run: |
          {
            echo '### APK sizes'
            echo
            echo '| Variant | Size | Path |'
            echo '| --- | --- | --- |'
            for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
              [ -f "$apk" ] || continue
              size=$(du -h "$apk" | cut -f1)
              echo "| $(basename "$apk") | $size | \`$apk\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: you-tube-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: you-tube-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # The R8 mapping file is what turns a crash report's obfuscated frames back into source lines.
      # It is worthless if it is not archived with the build that produced it.
      - name: Upload release mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: you-tube-release-mapping
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/release/configuration.txt
            app/build/outputs/mapping/release/usage.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: you-tube-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
