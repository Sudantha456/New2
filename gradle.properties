# ─────────────────────────────────────────────────────────────────────────────
#  You-Tube — Gradle / AGP configuration
# ─────────────────────────────────────────────────────────────────────────────

# Build daemon: 3 GB heap is what R8 full-mode + Compose IR needs on a cold build.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# AndroidX + namespaced (non-transitive) R classes: smaller R class, faster D8.
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# R8 full mode — the aggressive optimiser pipeline (class merging, widening of
# access, more inlining). Consumed by :app's minifiedRelease build.
android.enableR8.fullMode=true

# Only build the ABIs and the variant metadata we actually ship.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false
android.defaults.buildfeatures.resvalues=false

kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# Suppress the "compileSdk is newer than AGP" nag when users bump the SDK locally.
android.suppressUnsupportedCompileSdk=36
